name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The API is a serverless bundle built by Vercel, so there is no api build
      # step here; typechecking it is what catches import and type breakage.
      - name: Typecheck API
        run: bun run --cwd apps/api typecheck

      - name: Typecheck web
        run: bun run --cwd apps/web typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # API tests run against embedded PGlite, so no database service is needed.
      - name: Test API
        run: bun run --cwd apps/api test

      - name: Build web
        run: bun run --cwd apps/web build
